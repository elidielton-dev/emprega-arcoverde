services:
  postgres:
    image: postgres:16-alpine
    container_name: emprega-arcoverde-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: emprega_arcoverde
    ports:
      - "5432:5432"
    volumes:
      - emprega_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d emprega_arcoverde"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  emprega_pgdata:
